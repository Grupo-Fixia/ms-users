server:
  port: 8080

spring:
  application:
    name: ms-users

  datasource:
    url: ${SPRING_DATASOURCE_URL:jdbc:postgresql://localhost:5432/ms-users}
    username: ${SPRING_DATASOURCE_USERNAME:user}
    password: ${SPRING_DATASOURCE_PASSWORD:password}
    driver-class-name: org.postgresql.Driver

  jpa:
    hibernate:
      ddl-auto: validate
    open-in-view: false
    show-sql: false

  flyway:
    enabled: true
    locations: classpath:db/migration

  # Relay del Outbox (GC-500): publica evaluacion.registrada en fixia.users.evaluations.
  kafka:
    bootstrap-servers: ${KAFKA_BOOTSTRAP_SERVERS:${KAFKA_HOST:localhost:9092}}
    producer:
      key-serializer: org.apache.kafka.common.serialization.StringSerializer
      value-serializer: org.apache.kafka.common.serialization.StringSerializer
      acks: all
      retries: 3
      properties:
        enable.idempotence: true
        max.in.flight.requests.per.connection: 5

fixia:
  jwt:
    issuer: ${JWT_ISSUER:https://auth.fixia.com}
    audience: ${JWT_AUDIENCE:https://api.fixia.com}
    # Tiempos de vida no definidos en el SRS: valores por defecto ajustables por entorno.
    access-token-ttl: ${JWT_ACCESS_TTL:15m}
    refresh-token-ttl: ${JWT_REFRESH_TTL:7d}
    # PEM (PKCS#8 la privada, X.509 la pública). Obligatorias fuera de los perfiles local y test.
    private-key: ${JWT_PRIVATE_KEY:}
    public-key: ${JWT_PUBLIC_KEY:}
  outbox:
    relay:
      enabled: ${FIXIA_OUTBOX_RELAY_ENABLED:true}
      fixed-delay-ms: ${FIXIA_OUTBOX_RELAY_DELAY_MS:2000}
      initial-delay-ms: ${FIXIA_OUTBOX_RELAY_INITIAL_DELAY_MS:5000}
      batch-size: ${FIXIA_OUTBOX_RELAY_BATCH_SIZE:50}
      publish-timeout-seconds: ${FIXIA_OUTBOX_RELAY_TIMEOUT_SECONDS:5}
  internal:
    # Clave compartida con los microservicios que consultan /internal/**. Sin ella, esas rutas rechazan todo.
    api-key: ${INTERNAL_API_KEY:}

management:
  endpoints:
    web:
      exposure:
        include: health, metrics, prometheus
  endpoint:
    health:
      probes:
        enabled: true
    prometheus:
      enabled: true
