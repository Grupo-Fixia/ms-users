spring:
  datasource:
    url: jdbc:h2:mem:users-test;MODE=PostgreSQL;DATABASE_TO_LOWER=TRUE;DEFAULT_NULL_ORDERING=HIGH;DB_CLOSE_DELAY=-1
    username: sa
    password: ""
    driver-class-name: org.h2.Driver
  kafka:
    bootstrap-servers: localhost:9092

fixia:
  replication:
    # Las pruebas llaman al publicador y al manejador directamente.
    publisher:
      enabled: false
    consumer:
      enabled: false
      topics: fixia.services.participations
      group-id: ms-users-test
  outbox:
    relay:
      enabled: false
  internal:
    api-key: clave-interna-de-prueba
